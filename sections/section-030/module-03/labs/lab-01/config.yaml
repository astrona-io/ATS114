# Configure A Database Role With A Username Template
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-114-lab-030-03"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-openbao"
      description: "Installs Helm 3.22.1, the bao CLI 2.7.1 and OpenBao 2.7.1, initialized and unsealed, plus PostgreSQL 17"
      type: "file"
      source: "bootstrap/01-install-openbao.sh"
    - name: "ats-114-lab-030-03-setup"
      description: "Creates the starting state the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The tester pod (namespace clients)."
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-openbao"
      description: "Waits until OpenBao is unsealed and answers from the tester pod"
      type: "file"
      source: "testing/wait-for-openbao.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-username-template"
      description: "Confirms credentials of the role writer have names like inv-writer-xxxxxxxx"
      type: "file"
      source: "validation/validate-username-template.sh"
    - name: "validate-password-policy"
      description: "Confirms the policy inventory-password exists and generated passwords have 24 characters"
      type: "file"
      source: "validation/validate-password-policy.sh"
    - name: "validate-writer-role"
      description: "Confirms the writer role has the right TTLs, rights and a working revocation"
      type: "file"
      source: "validation/validate-writer-role.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - nicolaka/netshoot:v0.13
      - quay.io/openbao/openbao:2.7.1
      - postgres:17-alpine
