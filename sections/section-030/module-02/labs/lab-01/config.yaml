# Revoke And Renew Database Leases
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-114-lab-030-02"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-openbao"
      description: "Installs Helm 3.22.1, the bao CLI 2.7.1 and OpenBao 2.7.1, initialized and unsealed, plus PostgreSQL 17"
      type: "file"
      source: "bootstrap/01-install-openbao.sh"
    - name: "ats-114-lab-030-02-setup"
      description: "Creates the starting state the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The tester pod (namespace clients)."
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-openbao"
      description: "Waits until OpenBao is unsealed and answers from the tester pod"
      type: "file"
      source: "testing/wait-for-openbao.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-old-leases-revoked"
      description: "Confirms the three seeded leases are gone and their database users are dropped"
      type: "file"
      source: "validation/validate-old-leases-revoked.sh"
    - name: "validate-role-ttls"
      description: "Confirms the role has default_ttl 5m and max_ttl 30m"
      type: "file"
      source: "validation/validate-role-ttls.sh"
    - name: "validate-one-renewed-lease"
      description: "Confirms exactly one active lease exists and it was renewed"
      type: "file"
      source: "validation/validate-one-renewed-lease.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - nicolaka/netshoot:v0.13
      - quay.io/openbao/openbao:2.7.1
      - postgres:17-alpine
