# Set Up Time-Based One-Time Passwords
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-114-lab-050-01"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-openbao"
      description: "Installs Helm 3.22.1, the bao CLI 2.7.1 and OpenBao 2.7.1, initialized and unsealed"
      type: "file"
      source: "bootstrap/01-install-openbao.sh"
    - name: "ats-114-lab-050-01-setup"
      description: "Creates the starting state the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The tester pod (namespace clients)."
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-openbao"
      description: "Waits until OpenBao is unsealed and answers from the tester pod"
      type: "file"
      source: "testing/wait-for-openbao.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-deploy-approval-key"
      description: "Confirms the key deploy-approval has the requested settings"
      type: "file"
      source: "validation/validate-deploy-approval-key.sh"
    - name: "validate-partner-key"
      description: "Confirms partner-vpn was imported from the partner secret by comparing codes"
      type: "file"
      source: "validation/validate-partner-key.sh"
    - name: "validate-validator-policy"
      description: "Confirms totp-validator can validate codes but not generate them"
      type: "file"
      source: "validation/validate-validator-policy.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - nicolaka/netshoot:v0.13
      - quay.io/openbao/openbao:2.7.1
