# Lock Down SSH And TOTP After An Audit
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-114-capstone-050"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-openbao"
      description: "Installs Helm 3.22.1, the bao CLI 2.7.1 and OpenBao 2.7.1, initialized and unsealed"
      type: "file"
      source: "bootstrap/01-install-openbao.sh"
    - name: "ats-114-capstone-050-setup"
      description: "Creates the starting state the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The tester pod (namespace clients)."
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-openbao"
      description: "Waits until OpenBao is unsealed and answers from the tester pod"
      type: "file"
      source: "testing/wait-for-openbao.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-ops-role"
      description: "Confirms the role ops allows only the principal ops, with short lifetimes and a source address"
      type: "file"
      source: "validation/validate-ops-role.sh"
    - name: "validate-approval-key-replaced"
      description: "Confirms prod-approval no longer uses the leaked secret and has the requested settings"
      type: "file"
      source: "validation/validate-approval-key-replaced.sh"
    - name: "validate-signer-policy"
      description: "Confirms ssh-signer can sign through the role ops and nothing else"
      type: "file"
      source: "validation/validate-signer-policy.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - nicolaka/netshoot:v0.13
      - quay.io/openbao/openbao:2.7.1
