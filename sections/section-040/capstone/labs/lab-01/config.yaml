# Rotate Everything After A Leak
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-114-capstone-040"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-openbao"
      description: "Installs Helm 3.22.1, the bao CLI 2.7.1 and OpenBao 2.7.1, initialized and unsealed, plus PostgreSQL 17"
      type: "file"
      source: "bootstrap/01-install-openbao.sh"
    - name: "ats-114-capstone-040-setup"
      description: "Creates the starting state the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The tester pod (namespace clients)."
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-openbao"
      description: "Waits until OpenBao is unsealed and answers from the tester pod"
      type: "file"
      source: "testing/wait-for-openbao.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-kv-leak-removed"
      description: "Confirms version 2 of inventory/db is destroyed and the current version holds the data of version 1"
      type: "file"
      source: "validation/validate-kv-leak-removed.sh"
    - name: "validate-records-rewrapped"
      description: "Confirms every record in the ConfigMap encrypted-records uses the newest key version"
      type: "file"
      source: "validation/validate-records-rewrapped.sh"
    - name: "validate-records-decrypt"
      description: "Confirms every record still decrypts to its original text"
      type: "file"
      source: "validation/validate-records-decrypt.sh"
    - name: "validate-old-versions-retired"
      description: "Confirms the key inventory-records decrypts only with its newest version"
      type: "file"
      source: "validation/validate-old-versions-retired.sh"
    - name: "validate-leaked-leases-revoked"
      description: "Confirms the four leaked database leases are revoked and their users are gone"
      type: "file"
      source: "validation/validate-leaked-leases-revoked.sh"
    - name: "validate-root-rotated"
      description: "Confirms OpenBao rotated the password of openbao_admin and still creates credentials"
      type: "file"
      source: "validation/validate-root-rotated.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - nicolaka/netshoot:v0.13
      - postgres:17-alpine
      - quay.io/openbao/openbao:2.7.1
