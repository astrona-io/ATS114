# Rewrap Records And Retire Old Key Versions
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-114-lab-040-01"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-openbao"
      description: "Installs Helm 3.22.1, the bao CLI 2.7.1 and OpenBao 2.7.1, initialized and unsealed"
      type: "file"
      source: "bootstrap/01-install-openbao.sh"
    - name: "ats-114-lab-040-01-setup"
      description: "Creates the starting state the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The tester pod (namespace clients)."
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-openbao"
      description: "Waits until OpenBao is unsealed and answers from the tester pod"
      type: "file"
      source: "testing/wait-for-openbao.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-records-rewrapped"
      description: "Confirms every record in the ConfigMap encrypted-records uses the newest key version"
      type: "file"
      source: "validation/validate-records-rewrapped.sh"
    - name: "validate-records-decrypt"
      description: "Confirms every record still decrypts to its original text"
      type: "file"
      source: "validation/validate-records-decrypt.sh"
    - name: "validate-old-versions-retired"
      description: "Confirms the key inventory-records decrypts only with its newest version"
      type: "file"
      source: "validation/validate-old-versions-retired.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - nicolaka/netshoot:v0.13
      - quay.io/openbao/openbao:2.7.1
