# Knowledge check for section 040. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
id: ats114-040
course_id: ATS114
exam_code: OPENBAO
status: draft
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-040
  title: "Encryption As A Service With Transit"
placement:
  position: after
  reading: sections/section-040/capstone/labs/lab-01/question.md
questions:
  - id: ats114-040-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Know what Transit stores"
    source_readings:
      - sections/section-040/module-01/course-01-encryption-as-a-service.md
    prompt: "What does the Transit engine store?"
    options:
      - id: a
        text: "Keys only. The application stores the ciphertext."
        explanation: "Correct. If the application loses the ciphertext, the data is gone."
      - id: b
        text: "The ciphertext of every request."
        explanation: "Not correct. Transit keeps no copy of the ciphertext."
      - id: c
        text: "The plaintext, encrypted, for later decrypt calls."
        explanation: "Not correct. Transit keeps no plaintext."
      - id: d
        text: "Nothing, because keys live in the application."
        explanation: "Not correct. The keys live in OpenBao."
    correct_option: a
    explanation: "Correct. If the application loses the ciphertext, the data is gone."

  - id: ats114-040-q02
    type: single_choice
    difficulty: beginner
    learning_objective: "Read a ciphertext prefix"
    source_readings:
      - sections/section-040/module-01/course-01-encryption-as-a-service.md
    prompt: "A ciphertext starts with `vault:v2:`. What does `v2` mean?"
    options:
      - id: a
        text: "The data was encrypted twice."
        explanation: "Not correct. It names a key version."
      - id: b
        text: "Key version 2 of the Transit key encrypted it."
        explanation: "Correct. Transit reads the version to pick the right key."
      - id: c
        text: "The ciphertext uses version 2 of the API."
        explanation: "Not correct. It is not an API version."
      - id: d
        text: "The ciphertext expires after 2 days."
        explanation: "Not correct. Ciphertext has no expiry."
    correct_option: b
    explanation: "Correct. Transit reads the version to pick the right key."

  - id: ats114-040-q03
    type: single_choice
    difficulty: beginner
    learning_objective: "Prepare plaintext for encryption"
    source_readings:
      - sections/section-040/module-01/course-01-encryption-as-a-service.md
    prompt: "How must the plaintext be sent to `transit/encrypt/<key>`?"
    options:
      - id: a
        text: "As plain text with no change."
        explanation: "Not correct. Transit rejects it or decrypts to something else."
      - id: b
        text: "Compressed with gzip."
        explanation: "Not correct. Transit does not expect gzip."
      - id: c
        text: "Base64-encoded."
        explanation: "Correct. Decode the Base64 answer after decrypting."
      - id: d
        text: "Encrypted already with a local key."
        explanation: "Not correct. Transit does the encryption."
    correct_option: c
    explanation: "Correct. Decode the Base64 answer after decrypting."

  - id: ats114-040-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain different ciphertexts"
    source_readings:
      - sections/section-040/module-01/course-01-encryption-as-a-service.md
    prompt: "You encrypt the same text twice with the same key and get two different ciphertexts. Why, and do both decrypt?"
    options:
      - id: a
        text: "The key rotated between the two calls. Only the newer one decrypts."
        explanation: "Not correct. Rotation did not happen here."
      - id: b
        text: "One of them is corrupt."
        explanation: "Not correct. Both are valid."
      - id: c
        text: "Transit adds a timestamp. Decrypt fails after one hour."
        explanation: "Not correct. Transit adds no expiry."
      - id: d
        text: "Each encryption uses a new random initialization vector. Both decrypt to the same text."
        explanation: "Correct. Do not compare ciphertexts to find equal values."
    correct_option: d
    explanation: "Correct. Do not compare ciphertexts to find equal values."

  - id: ats114-040-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Use a data key"
    source_readings:
      - sections/section-040/module-01/course-01-encryption-as-a-service.md
    prompt: "Which is the right use of `transit/datakey/plaintext/<key>` for a large file?"
    options:
      - id: a
        text: "Encrypt the file locally with the plaintext data key, store the encrypted data key beside it, and throw the plaintext key away."
        explanation: "Correct. Transit decrypts the data key later."
      - id: b
        text: "Send the file to Transit in one request, whatever its size."
        explanation: "Not correct. The request size is limited."
      - id: c
        text: "Keep the plaintext data key in the database next to the file."
        explanation: "Not correct. That puts the key next to the data."
      - id: d
        text: "Export the Transit key and encrypt locally with it."
        explanation: "Not correct. Transit keys are not exportable by default."
    correct_option: a
    explanation: "Correct. Transit decrypts the data key later."

  - id: ats114-040-q06
    type: single_choice
    difficulty: beginner
    learning_objective: "Explain a key rotation"
    source_readings:
      - sections/section-040/module-01/course-02-key-rotation-and-rewrap.md
    prompt: "After `bao write -f transit/keys/inventory-records/rotate`, what happens?"
    options:
      - id: a
        text: "All old ciphertext is re-encrypted at once."
        explanation: "Not correct. That is rewrap, and the application must run it."
      - id: b
        text: "A new key version is added. New encryptions use it, and older versions stay so old ciphertext still decrypts."
        explanation: "Correct. `latest_version` goes up by one."
      - id: c
        text: "The old versions are deleted."
        explanation: "Not correct. They stay in the key ring."
      - id: d
        text: "The key name changes."
        explanation: "Not correct. The name stays the same."
    correct_option: b
    explanation: "Correct. `latest_version` goes up by one."

  - id: ats114-040-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain rewrap"
    source_readings:
      - sections/section-040/module-01/course-02-key-rotation-and-rewrap.md
    prompt: "What does `transit/rewrap/<key>` return?"
    options:
      - id: a
        text: "The plaintext, Base64-encoded."
        explanation: "Not correct. That is decrypt. Rewrap never returns plaintext."
      - id: b
        text: "A new data key."
        explanation: "Not correct. That is `datakey`."
      - id: c
        text: "A new ciphertext encrypted with the newest key version, made inside OpenBao without returning the plaintext."
        explanation: "Correct. The application must save the new ciphertext."
      - id: d
        text: "A new key version."
        explanation: "Not correct. That is rotate."
    correct_option: c
    explanation: "Correct. The application must save the new ciphertext."

  - id: ats114-040-q08
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain min_decryption_version"
    source_readings:
      - sections/section-040/module-01/course-02-key-rotation-and-rewrap.md
    prompt: "What does `min_decryption_version` control?"
    options:
      - id: a
        text: "The oldest version that may still encrypt."
        explanation: "Not correct. New encryptions always use the latest version."
      - id: b
        text: "The number of versions kept in total."
        explanation: "Not correct. It does not remove versions."
      - id: c
        text: "How often the key rotates."
        explanation: "Not correct. That is `auto_rotate_period`."
      - id: d
        text: "The oldest key version that may still decrypt. Older versions are archived."
        explanation: "Correct. Raise it only after every record is rewrapped."
    correct_option: d
    explanation: "Correct. Raise it only after every record is rewrapped."

  - id: ats114-040-q09
    type: single_choice
    difficulty: advanced
    learning_objective: "Order a key retirement"
    source_readings:
      - sections/section-040/module-01/course-02-key-rotation-and-rewrap.md
    prompt: "A key might have leaked. Which order is safe?"
    options:
      - id: a
        text: "Rotate, rewrap and save every record, then raise `min_decryption_version`."
        explanation: "Correct. Retiring first would make records on old versions unreadable."
      - id: b
        text: "Raise `min_decryption_version`, rotate, then rewrap."
        explanation: "Not correct. Old records stop decrypting before they are rewrapped."
      - id: c
        text: "Rewrap, then rotate, then raise `min_decryption_version`."
        explanation: "Not correct. Rewrap before rotate has no newer version to move to."
      - id: d
        text: "Delete the key and create one with the same name."
        explanation: "Not correct. The new key has new material, and old ciphertext is lost."
    correct_option: a
    explanation: "Correct. Retiring first would make records on old versions unreadable."

  - id: ats114-040-q10
    type: single_choice
    difficulty: intermediate
    learning_objective: "Separate Transit rotation from barrier rotation"
    source_readings:
      - sections/section-040/module-01/course-02-key-rotation-and-rewrap.md
    prompt: "What does `bao operator rotate` do?"
    options:
      - id: a
        text: "It rotates every Transit key."
        explanation: "Not correct. Transit keys are separate."
      - id: b
        text: "It rotates the barrier encryption key that protects OpenBao's own storage. It does not change any Transit key."
        explanation: "Correct. Use `transit/keys/<name>/rotate` for a Transit key."
      - id: c
        text: "It rewraps all stored ciphertext."
        explanation: "Not correct. Rewrap is a Transit request."
      - id: d
        text: "It trims old versions of a Transit key."
        explanation: "Not correct. Trim is `transit/keys/<name>/trim`."
    correct_option: b
    explanation: "Correct. Use `transit/keys/<name>/rotate` for a Transit key."
