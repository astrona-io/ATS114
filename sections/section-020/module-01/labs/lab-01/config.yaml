# Build A Two-Tier CA For The Inventory Services
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-114-lab-020-01"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"

bootstrap:
  init:
    - name: "install-openbao"
      description: "Installs Helm 3.22.1, the bao CLI 2.7.1 and OpenBao 2.7.1, initialized and unsealed"
      type: "file"
      source: "bootstrap/01-install-openbao.sh"
    - name: "ats-114-lab-020-01-setup"
      description: "Creates the starting state the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The tester pod (namespace clients)."
      type: "file"
      source: "manifests/lab-start.yaml"

testing:
  init:
    - name: "wait-for-openbao"
      description: "Waits until OpenBao is unsealed and answers from the tester pod"
      type: "file"
      source: "testing/wait-for-openbao.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "validate-root-ca"
      description: "Confirms pki holds a self-signed root CA named Inventory Root CA"
      type: "file"
      source: "validation/validate-root-ca.sh"
    - name: "validate-intermediate-ca"
      description: "Confirms pki_int holds an intermediate CA named Inventory Intermediate CA, signed by the root CA"
      type: "file"
      source: "validation/validate-intermediate-ca.sh"
    - name: "validate-role"
      description: "Confirms the role inventory-svc on pki_int allows names under inventory.svc for at most 72 hours"
      type: "file"
      source: "validation/validate-role.sh"
    - name: "validate-issued-certificate"
      description: "Confirms a certificate for api.inventory.svc verifies against the full chain and other names are refused"
      type: "file"
      source: "validation/validate-issued-certificate.sh"
    - name: "validate-urls"
      description: "Confirms pki_int puts its issuing certificate and CRL URLs on openbao.localtest.me into certificates"
      type: "file"
      source: "validation/validate-urls.sh"

teardown:
  keepCluster: false
