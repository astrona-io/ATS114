# Configure CRL, OCSP And Tidy For A PKI Mount
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-114-lab-020-03"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-openbao"
      description: "Installs Helm 3.22.1, the bao CLI 2.7.1 and OpenBao 2.7.1, initialized and unsealed"
      type: "file"
      source: "bootstrap/01-install-openbao.sh"
    - name: "ats-114-lab-020-03-setup"
      description: "Creates the starting state the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The tester pod (namespace clients)."
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-openbao"
      description: "Waits until OpenBao is unsealed and answers from the tester pod"
      type: "file"
      source: "testing/wait-for-openbao.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-certificate-revoked"
      description: "Confirms the leaked certificate is revoked and no other certificate is"
      type: "file"
      source: "validation/validate-certificate-revoked.sh"
    - name: "validate-crl-and-urls"
      description: "Confirms the CRL lifetime, automatic rebuild and the OCSP address"
      type: "file"
      source: "validation/validate-crl-and-urls.sh"
    - name: "validate-auto-tidy"
      description: "Confirms auto-tidy is enabled with the requested options"
      type: "file"
      source: "validation/validate-auto-tidy.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - nicolaka/netshoot:v0.13
      - quay.io/openbao/openbao:2.7.1
