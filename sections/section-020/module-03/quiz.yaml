# Knowledge check for section 020 module 03. Listed in astrona.yaml as a `type: quiz` entry after the module summary.
schema_version: 1
kind: question_bank
id: ats114-020-03
course_id: ATS114
exam_code: OPENBAO
status: draft
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: module
  id: section-020-module-03
  title: "Certificate Revocation, OCSP And Tidy In The PKI Engine"
placement:
  position: after
  reading: sections/section-020/module-03/course-05-summary.md
questions:
  - id: ats114-020-03-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Revoke by serial"
    source_readings:
      - sections/section-020/module-03/course-01-revoking-certificates-and-reading-the-crl.md
    prompt: "Which request revokes a certificate by its serial number?"
    options:
      - id: a
        text: "`pki/revoke` with `serial_number`."
        explanation: "Correct. It sets a revocation time and rebuilds the CRL."
      - id: b
        text: "`pki/delete` with the serial number."
        explanation: "Not correct. Deleting is not revoking."
      - id: c
        text: "`pki/tidy`"
        explanation: "Not correct. Tidy removes expired entries."
      - id: d
        text: "`pki/roles/revoke`"
        explanation: "Not correct. Roles do not revoke."
    correct_option: a
    explanation: "Correct. It sets a revocation time and rebuilds the CRL."

  - id: ats114-020-03-q02
    type: single_choice
    difficulty: intermediate
    learning_objective: "Revoke with the key"
    source_readings:
      - sections/section-020/module-03/course-01-revoking-certificates-and-reading-the-crl.md
    prompt: "Who can use `pki/revoke-with-key`?"
    options:
      - id: a
        text: "Only the root token."
        explanation: "Not correct. The holder can use it too."
      - id: b
        text: "Only the CA administrator."
        explanation: "Not correct. The holder with the key can revoke."
      - id: c
        text: "Nobody; it is for tests."
        explanation: "Not correct. It is a real endpoint."
      - id: d
        text: "The holder of the certificate and its private key, also for certificates that were not stored."
        explanation: "Correct. The key proves ownership."
    correct_option: d
    explanation: "Correct. The key proves ownership."

  - id: ats114-020-03-q03
    type: single_choice
    difficulty: beginner
    learning_objective: "Fetch the CRL"
    source_readings:
      - sections/section-020/module-03/course-01-revoking-certificates-and-reading-the-crl.md
    prompt: "How does a client get the CRL?"
    options:
      - id: a
        text: "Only with the root token."
        explanation: "Not correct. It is served without a token."
      - id: b
        text: "From the role."
        explanation: "Not correct. Roles do not serve CRLs."
      - id: c
        text: "From `pki/crl`, without a token."
        explanation: "Correct. The CRL is public."
      - id: d
        text: "Only through OCSP."
        explanation: "Not correct. OCSP is a separate service."
    correct_option: c
    explanation: "Correct. The CRL is public."

  - id: ats114-020-03-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Limit the revocation delay"
    source_readings:
      - sections/section-020/module-03/course-02-configuring-the-crl.md
    prompt: "What decides the worst case before a client learns of a revocation?"
    options:
      - id: a
        text: "The role TTL."
        explanation: "Not correct. The CRL expiry decides."
      - id: b
        text: "The `expiry` of the CRL, because clients fetch the list again only after it expires."
        explanation: "Correct. A client keeps its copy until then."
      - id: c
        text: "The mount's max lease TTL."
        explanation: "Not correct. The CRL expiry decides."
      - id: d
        text: "The serial number length."
        explanation: "Not correct. It has no effect."
    correct_option: b
    explanation: "Correct. A client keeps its copy until then."

  - id: ats114-020-03-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Keep the CRL fresh"
    source_readings:
      - sections/section-020/module-03/course-02-configuring-the-crl.md
    prompt: "What does `auto_rebuild` do?"
    options:
      - id: a
        text: "It rebuilds the CRL before it expires, so a quiet CA's list does not expire."
        explanation: "Correct. Without it a quiet CA lets the list expire."
      - id: b
        text: "It revokes all expired certificates."
        explanation: "Not correct. It rebuilds the list only."
      - id: c
        text: "It turns on OCSP."
        explanation: "Not correct. OCSP is separate."
      - id: d
        text: "It deletes the old CRL."
        explanation: "Not correct. It builds a new one."
    correct_option: a
    explanation: "Correct. Without it a quiet CA lets the list expire."

  - id: ats114-020-03-q06
    type: single_choice
    difficulty: beginner
    learning_objective: "Know OCSP"
    source_readings:
      - sections/section-020/module-03/course-03-ocsp-and-the-urls-in-a-certificate.md
    prompt: "What does an OCSP responder answer?"
    options:
      - id: a
        text: "The whole list of revoked certificates."
        explanation: "Not correct. That is the CRL."
      - id: b
        text: "The expiry of the issuer."
        explanation: "Not correct. It reports certificate status."
      - id: c
        text: "Whether the role exists."
        explanation: "Not correct. It reports certificate status."
      - id: d
        text: "The status of one certificate: good, revoked or unknown."
        explanation: "Correct. It answers per certificate."
    correct_option: d
    explanation: "Correct. It answers per certificate."

  - id: ats114-020-03-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Set the URLs in time"
    source_readings:
      - sections/section-020/module-03/course-03-ocsp-and-the-urls-in-a-certificate.md
    prompt: "When must `pki/config/urls` be set for a certificate to carry the addresses?"
    options:
      - id: a
        text: "After issuing; OpenBao updates old certificates."
        explanation: "Not correct. It does not update them."
      - id: b
        text: "Only at the moment of revocation."
        explanation: "Not correct. They are written at issue time."
      - id: c
        text: "Before the certificate is issued."
        explanation: "Correct. Existing certificates are not changed."
      - id: d
        text: "Never; they are added by clients."
        explanation: "Not correct. The CA writes them."
    correct_option: c
    explanation: "Correct. Existing certificates are not changed."

  - id: ats114-020-03-q08
    type: single_choice
    difficulty: beginner
    learning_objective: "Know tidy"
    source_readings:
      - sections/section-020/module-03/course-04-tidy-and-auto-tidy.md
    prompt: "What does tidy remove?"
    options:
      - id: a
        text: "All revoked certificates at once."
        explanation: "Not correct. Only expired ones, after the buffer."
      - id: b
        text: "Expired certificates and expired revocation entries, as selected."
        explanation: "Correct. It cleans storage and the CRL."
      - id: c
        text: "Roles that are not used."
        explanation: "Not correct. Tidy touches certificates."
      - id: d
        text: "The root CA."
        explanation: "Not correct. Tidy never removes the CA."
    correct_option: b
    explanation: "Correct. It cleans storage and the CRL."

  - id: ats114-020-03-q09
    type: single_choice
    difficulty: intermediate
    learning_objective: "Schedule tidy"
    source_readings:
      - sections/section-020/module-03/course-04-tidy-and-auto-tidy.md
    prompt: "Which path runs tidy on a schedule?"
    options:
      - id: a
        text: "`pki/config/auto-tidy`"
        explanation: "Correct. `pki/tidy` runs once."
      - id: b
        text: "`pki/tidy` with `repeat=true`."
        explanation: "Not correct. `pki/tidy` is a one-time run."
      - id: c
        text: "`pki/config/crl`"
        explanation: "Not correct. This configures the CRL."
      - id: d
        text: "`sys/tidy`"
        explanation: "Not correct. This path does not exist."
    correct_option: a
    explanation: "Correct. `pki/tidy` runs once."

  - id: ats114-020-03-q10
    type: single_choice
    difficulty: intermediate
    learning_objective: "Use the safety buffer"
    source_readings:
      - sections/section-020/module-03/course-04-tidy-and-auto-tidy.md
    prompt: "Why keep a `safety_buffer` of several hours or days?"
    options:
      - id: a
        text: "To make tidy run faster."
        explanation: "Not correct. It does not affect speed."
      - id: b
        text: "To keep the root CA from expiring."
        explanation: "Not correct. It affects only entries."
      - id: c
        text: "It is required to enable OCSP."
        explanation: "Not correct. It is unrelated to OCSP."
      - id: d
        text: "So clients can still see recent entries in the last CRL before they are removed."
        explanation: "Correct. A near-zero buffer removes entries too early."
    correct_option: d
    explanation: "Correct. A near-zero buffer removes entries too early."
