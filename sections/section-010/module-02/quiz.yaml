# Knowledge check for section 010 module 02. Listed in astrona.yaml as a `type: quiz` entry after the module summary.
schema_version: 1
kind: question_bank
id: ats114-010-02
course_id: ATS114
exam_code: OPENBAO
status: alpha
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: module
  id: section-010-module-02
  title: "Manage Secrets Engine Mounts"
placement:
  position: after
  reading: sections/section-010/module-02/course-05-summary.md
questions:
  - id: ats114-010-02-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Define a mount"
    source_readings:
      - sections/section-010/module-02/course-01-mounts-paths-and-engine-types.md
    prompt: "What is a mount in OpenBao?"
    options:
      - id: a
        text: "The path where a secrets engine is attached, which the router uses to send requests to that engine."
        explanation: "Correct. OpenBao reads the first segment of the request path and sends the request to the engine mounted there."
      - id: b
        text: "A copy of an engine's data stored on another server."
        explanation: "Not correct. A mount is a path, not a copy of data."
      - id: c
        text: "A token that lets a client use an engine."
        explanation: "Not correct. Tokens are separate from mounts."
      - id: d
        text: "A policy that limits an engine to one team."
        explanation: "Not correct. Policies are separate from mounts."
    correct_option: a
    explanation: "Correct. OpenBao reads the first segment of the request path and sends the request to the engine mounted there."

  - id: ats114-010-02-q02
    type: single_choice
    difficulty: beginner
    learning_objective: "List mounts in detail"
    source_readings:
      - sections/section-010/module-02/course-01-mounts-paths-and-engine-types.md
    prompt: "Which command shows the type, accessor, description and options of every mount?"
    options:
      - id: a
        text: "`bao mounts show`"
        explanation: "Not correct. This is not a bao command."
      - id: b
        text: "`bao auth list`"
        explanation: "Not correct. This lists authentication methods, not secrets engines."
      - id: c
        text: "`bao secrets enable -list`"
        explanation: "Not correct. `enable` creates a mount; it does not list mounts."
      - id: d
        text: "`bao secrets list -detailed`"
        explanation: "Correct. The detailed list shows the whole mount table."
    correct_option: d
    explanation: "Correct. The detailed list shows the whole mount table."

  - id: ats114-010-02-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Mount one engine twice"
    source_readings:
      - sections/section-010/module-02/course-01-mounts-paths-and-engine-types.md
    prompt: "A team needs two separate KV stores with different settings. What is the right approach?"
    options:
      - id: a
        text: "Enable it once and use two secrets in it."
        explanation: "Not correct. Settings such as the default TTL are per mount, not per secret."
      - id: b
        text: "This is impossible; each engine type can be mounted only once."
        explanation: "Not correct. An engine type can be mounted at many paths."
      - id: c
        text: "Enable the KV engine twice at two different paths; each mount has its own data and settings."
        explanation: "Correct. The same engine can be mounted many times."
      - id: d
        text: "Use two OpenBao servers."
        explanation: "Not correct. One server can hold several mounts."
    correct_option: c
    explanation: "Correct. The same engine can be mounted many times."

  - id: ats114-010-02-q04
    type: single_choice
    difficulty: beginner
    learning_objective: "Know the lease TTL settings"
    source_readings:
      - sections/section-010/module-02/course-02-tuning-a-mount.md
    prompt: "What does `max_lease_ttl` on a mount set?"
    options:
      - id: a
        text: "The lifetime a lease gets when nothing asks for one."
        explanation: "Not correct. That is `default_lease_ttl`."
      - id: b
        text: "The ceiling for the lifetime of any lease from that mount."
        explanation: "Correct. It is the longest lease the mount allows."
      - id: c
        text: "The time a mount stays enabled."
        explanation: "Not correct. Mounts do not expire."
      - id: d
        text: "The maximum number of leases the mount can hold."
        explanation: "Not correct. The setting is a time, not a count."
    correct_option: b
    explanation: "Correct. It is the longest lease the mount allows."

  - id: ats114-010-02-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read a zero TTL"
    source_readings:
      - sections/section-010/module-02/course-02-tuning-a-mount.md
    prompt: "A mount shows `default_lease_ttl` as `0`. What applies?"
    options:
      - id: a
        text: "The system value applies to that mount."
        explanation: "Correct. A value of 0 means that the system default is used."
      - id: b
        text: "Leases from the mount never expire."
        explanation: "Not correct. Zero does not mean unlimited."
      - id: c
        text: "Leases from the mount expire at once."
        explanation: "Not correct. Zero does not mean immediate expiry."
      - id: d
        text: "The mount refuses to issue leases."
        explanation: "Not correct. The mount works normally."
    correct_option: a
    explanation: "Correct. A value of 0 means that the system default is used."

  - id: ats114-010-02-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Order the TTL limits"
    source_readings:
      - sections/section-010/module-02/course-02-tuning-a-mount.md
    prompt: "A role asks for a longer TTL than the mount maximum. What happens?"
    options:
      - id: a
        text: "The lease is issued with the longer TTL."
        explanation: "Not correct. The ceiling cannot be exceeded."
      - id: b
        text: "The mount maximum is raised automatically."
        explanation: "Not correct. Limits are never raised by requests."
      - id: c
        text: "The request is deleted and the role is removed."
        explanation: "Not correct. Nothing is deleted."
      - id: d
        text: "The lease is capped by the lower limit."
        explanation: "Correct. A request is capped by the ceiling that applies to it."
    correct_option: d
    explanation: "Correct. A request is capped by the ceiling that applies to it."

  - id: ats114-010-02-q07
    type: single_choice
    difficulty: beginner
    learning_objective: "Know what move keeps"
    source_readings:
      - sections/section-010/module-02/course-03-moving-and-disabling-mounts.md
    prompt: "What does `bao secrets move` keep?"
    options:
      - id: a
        text: "Only the settings; the data is deleted."
        explanation: "Not correct. Data is kept."
      - id: b
        text: "Only the data; the accessor changes."
        explanation: "Not correct. The accessor stays the same."
      - id: c
        text: "The data, the settings and the accessor of the mount."
        explanation: "Correct. Only the path changes."
      - id: d
        text: "Nothing; it is the same as disabling and enabling."
        explanation: "Not correct. Disabling deletes the data; move does not."
    correct_option: c
    explanation: "Correct. Only the path changes."

  - id: ats114-010-02-q08
    type: single_choice
    difficulty: intermediate
    learning_objective: "Know the effects of a move"
    source_readings:
      - sections/section-010/module-02/course-03-moving-and-disabling-mounts.md
    prompt: "What must you do after moving a mount?"
    options:
      - id: a
        text: "Nothing, because OpenBao redirects the old path."
        explanation: "Not correct. There is no redirect."
      - id: b
        text: "Update applications and policies that use the old path; leases on the mount were revoked."
        explanation: "Correct. Paths in policies and clients still point to the old name."
      - id: c
        text: "Re-enter all secrets of the mount."
        explanation: "Not correct. The data is kept."
      - id: d
        text: "Restart the OpenBao server."
        explanation: "Not correct. No restart is needed."
    correct_option: b
    explanation: "Correct. Paths in policies and clients still point to the old name."

  - id: ats114-010-02-q09
    type: single_choice
    difficulty: beginner
    learning_objective: "Know what disable does"
    source_readings:
      - sections/section-010/module-02/course-03-moving-and-disabling-mounts.md
    prompt: "What does `bao secrets disable` do to the data in the mount?"
    options:
      - id: a
        text: "It deletes it for good."
        explanation: "Correct. Disabling removes the data of the mount and its leases."
      - id: b
        text: "It keeps the data in a hidden state."
        explanation: "Not correct. The data is deleted."
      - id: c
        text: "It moves the data to `sys/`."
        explanation: "Not correct. Nothing is moved."
      - id: d
        text: "It marks the data deleted so it can be undeleted."
        explanation: "Not correct. Only KV soft deletes can be undone."
    correct_option: a
    explanation: "Correct. Disabling removes the data of the mount and its leases."

  - id: ats114-010-02-q10
    type: single_choice
    difficulty: intermediate
    learning_objective: "Upgrade KV v1"
    source_readings:
      - sections/section-010/module-02/course-04-kv-version-1-and-upgrading-to-version-2.md
    prompt: "A KV version 1 mount holds secrets. How do you get versioning?"
    options:
      - id: a
        text: "Mount a new KV v2 engine at the same path while the old one is enabled."
        explanation: "Not correct. Two mounts cannot share a path."
      - id: b
        text: "Run `bao kv rollback` on the mount."
        explanation: "Not correct. Rollback restores a secret version."
      - id: c
        text: "Versioning cannot be added to an existing mount."
        explanation: "Not correct. It can be enabled with one command."
      - id: d
        text: "Run `bao kv enable-versioning` on the mount; it cannot be turned back to version 1."
        explanation: "Correct. The upgrade is one way, and policies need the `data/` and `metadata/` paths afterwards."
    correct_option: d
    explanation: "Correct. The upgrade is one way, and policies need the `data/` and `metadata/` paths afterwards."
