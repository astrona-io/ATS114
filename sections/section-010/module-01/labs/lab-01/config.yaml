# Recover A Secret After A Bad Write
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-114-lab-010-01"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-openbao"
      description: "Installs Helm 3.22.1, the bao CLI 2.7.1 and OpenBao 2.7.1, initialized and unsealed"
      type: "file"
      source: "bootstrap/01-install-openbao.sh"
    - name: "ats-114-lab-010-01-setup"
      description: "Creates the starting state the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The tester pod (namespace clients)."
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-openbao"
      description: "Waits until OpenBao is unsealed and answers from the tester pod"
      type: "file"
      source: "testing/wait-for-openbao.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-db-restored"
      description: "Confirms the current version of inventory/db holds the data of version 2"
      type: "file"
      source: "validation/validate-db-restored.sh"
    - name: "validate-api-undeleted"
      description: "Confirms inventory/api version 1 is readable again and was not written a second time"
      type: "file"
      source: "validation/validate-api-undeleted.sh"
    - name: "validate-not-recreated"
      description: "Confirms both secrets keep their original version history"
      type: "file"
      source: "validation/validate-not-recreated.sh"
    - name: "validate-max-versions"
      description: "Confirms inventory/db keeps at most 5 versions"
      type: "file"
      source: "validation/validate-max-versions.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - nicolaka/netshoot:v0.13
      - quay.io/openbao/openbao:2.7.1
