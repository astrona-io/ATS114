# Final domain knowledge check across all four sections.
schema_version: 1
kind: question_bank
id: ats114-final
course_id: ATS114
exam_code: OPENBAO
status: draft
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: domain
  id: secrets-engines
  title: "Secrets Engines & Dynamic Credential Lifecycle"
questions:
  - id: ats114-final-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Enable the KV version 2 engine"
    source_readings:
      - sections/section-010/module-01/course-01-secrets-engines-and-kv-v2.md
    prompt: "Which command enables the KV version 2 engine at the path `secret/`?"
    options:
      - id: a
        text: "`bao secrets enable -path=secret kv`"
        explanation: "Not correct. This creates version 1, which keeps no history."
      - id: b
        text: "`bao secrets enable -path=secret kv-v2`"
        explanation: "Correct. The type must be `kv-v2` to keep a version history."
      - id: c
        text: "`bao kv put -mount=secret enable=true`"
        explanation: "Not correct. `bao kv put` writes a secret. It does not enable an engine."
      - id: d
        text: "`bao auth enable -path=secret kv-v2`"
        explanation: "Not correct. `bao auth enable` adds an authentication method, not a secrets engine."
    correct_option: b
    explanation: "Correct. The type must be `kv-v2` to keep a version history."

  - id: ats114-final-q02
    type: single_choice
    difficulty: beginner
    learning_objective: "Tell delete, destroy and undelete apart"
    source_readings:
      - sections/section-010/module-01/course-02-versions-deletes-and-rollback.md
    prompt: "A version of a secret leaked and must never be readable again. Which command do you run on it?"
    options:
      - id: a
        text: "`bao kv delete`"
        explanation: "Not correct. A soft delete keeps the data in storage, and `undelete` brings it back."
      - id: b
        text: "`bao kv undelete`"
        explanation: "Not correct. This reverses a soft delete. It removes nothing."
      - id: c
        text: "`bao kv destroy`"
        explanation: "Correct. Destroy removes the data from storage and cannot be undone."
      - id: d
        text: "`bao kv rollback`"
        explanation: "Not correct. This writes a new version from an old one. It removes nothing."
    correct_option: c
    explanation: "Correct. Destroy removes the data from storage and cannot be undone."

  - id: ats114-final-q03
    type: single_choice
    difficulty: advanced
    learning_objective: "Explain a failed check-and-set write"
    source_readings:
      - sections/section-010/module-01/course-03-metadata-and-check-and-set.md
    prompt: "A secret requires check-and-set. Two scripts both read version 2. The first runs `bao kv put -cas=2` and succeeds. Why does the second script's `-cas=2` write fail?"
    options:
      - id: a
        text: "The secret is locked for one hour after every write."
        explanation: "Not correct. KV version 2 has no write lock."
      - id: b
        text: "`-cas=2` is accepted only once for each secret."
        explanation: "Not correct. The value must match the current version, not be new."
      - id: c
        text: "The second script has no token."
        explanation: "Not correct. A missing token gives a permission error, not a check-and-set error."
      - id: d
        text: "Version 2 is no longer the current version, because the first write created version 3."
        explanation: "Correct. This is the lost update that check-and-set prevents."
    correct_option: d
    explanation: "Correct. This is the lost update that check-and-set prevents."

  - id: ats114-final-q04
    type: single_choice
    difficulty: beginner
    learning_objective: "Choose how the root key is created"
    source_readings:
      - sections/section-020/module-01/course-01-pki-engine-and-root-ca.md
    prompt: "You generate the root CA with `pki/root/generate/internal`. What happens to the private key?"
    options:
      - id: a
        text: "OpenBao creates it and never returns it."
        explanation: "Correct. The key stays inside OpenBao."
      - id: b
        text: "OpenBao returns it once in the response."
        explanation: "Not correct. That is the behavior of `exported`."
      - id: c
        text: "OpenBao writes it to a file on your machine."
        explanation: "Not correct. OpenBao does not write the key to your machine."
      - id: d
        text: "OpenBao leaves the key out, so you must create it with `openssl`."
        explanation: "Not correct. OpenBao creates the key itself."
    correct_option: a
    explanation: "Correct. The key stays inside OpenBao."

  - id: ats114-final-q05
    type: single_choice
    difficulty: beginner
    learning_objective: "Explain why an intermediate CA is used"
    source_readings:
      - sections/section-020/module-01/course-02-intermediate-ca.md
    prompt: "What is the main reason to let an intermediate CA sign service certificates instead of the root CA?"
    options:
      - id: a
        text: "An intermediate CA issues certificates that last longer than the root."
        explanation: "Not correct. The intermediate must be shorter than the root."
      - id: b
        text: "If the intermediate leaks, the root revokes it and signs a new one, and clients change nothing."
        explanation: "Correct. The root key is used only once per intermediate."
      - id: c
        text: "Clients then do not need to trust any CA."
        explanation: "Not correct. Clients still trust the root."
      - id: d
        text: "The root CA cannot sign service certificates at all."
        explanation: "Not correct. It can. The design avoids using the root key every day."
    correct_option: b
    explanation: "Correct. The root key is used only once per intermediate."

  - id: ats114-final-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Know who keeps the private key"
    source_readings:
      - sections/section-020/module-01/course-03-roles-issuing-and-revocation.md
    prompt: "You request a certificate from `pki_int/issue/inventory-svc`. Where is the private key of the new certificate kept afterwards?"
    options:
      - id: a
        text: "OpenBao stores it and returns it on request."
        explanation: "Not correct. OpenBao has no copy."
      - id: b
        text: "In the CRL."
        explanation: "Not correct. The CRL lists serial numbers only."
      - id: c
        text: "Only in the response. OpenBao does not store it, so the service must keep it."
        explanation: "Correct. If the service loses it, issue a new certificate."
      - id: d
        text: "In the root CA mount `pki/`."
        explanation: "Not correct. Issued private keys are not stored in any mount."
    correct_option: c
    explanation: "Correct. If the service loses it, issue a new certificate."

  - id: ats114-final-q07
    type: single_choice
    difficulty: beginner
    learning_objective: "Define a dynamic secret"
    source_readings:
      - sections/section-030/module-01/course-01-dynamic-secrets-and-the-database-engine.md
    prompt: "What makes a secret from the database secrets engine dynamic?"
    options:
      - id: a
        text: "A person types it into OpenBao and it changes every year."
        explanation: "Not correct. That describes a static secret."
      - id: b
        text: "It is stored in a KV mount with many versions."
        explanation: "Not correct. KV holds static secrets."
      - id: c
        text: "It is the same for every application."
        explanation: "Not correct. Each request gets its own value."
      - id: d
        text: "OpenBao creates it at the moment of the request, in a system it controls, such as a new PostgreSQL user."
        explanation: "Correct. OpenBao can also take it back."
    correct_option: d
    explanation: "Correct. OpenBao can also take it back."

  - id: ats114-final-q08
    type: single_choice
    difficulty: beginner
    learning_objective: "Reach PostgreSQL from OpenBao"
    source_readings:
      - sections/section-030/module-01/course-01-dynamic-secrets-and-the-database-engine.md
    prompt: "OpenBao runs in a pod in the cluster. Which host in `connection_url` reaches PostgreSQL?"
    options:
      - id: a
        text: "`postgres.data`, the Service `postgres` in the namespace `data`."
        explanation: "Correct. Use the Service name."
      - id: b
        text: "`localhost`"
        explanation: "Not correct. In the OpenBao pod, `localhost` is OpenBao itself."
      - id: c
        text: "`127.0.0.1`"
        explanation: "Not correct. This is the same as `localhost`."
      - id: d
        text: "`openbao.localtest.me`"
        explanation: "Not correct. This name points to the OpenBao port-forward on your machine."
    correct_option: a
    explanation: "Correct. Use the Service name."

  - id: ats114-final-q09
    type: single_choice
    difficulty: intermediate
    learning_objective: "Choose a static role"
    source_readings:
      - sections/section-030/module-01/course-03-root-rotation-and-static-roles.md
    prompt: "A reporting tool is configured with the user name `inventory_report` and cannot change it. Which role type fits?"
    options:
      - id: a
        text: "A dynamic role, because it makes a new user name for each request."
        explanation: "Not correct. The tool needs the same name every time."
      - id: b
        text: "A static role, which rotates the password of that one existing user and has no lease."
        explanation: "Correct. Read it at `database/static-creds/<role>`."
      - id: c
        text: "A dynamic role with a long `max_ttl`."
        explanation: "Not correct. It would still create new user names."
      - id: d
        text: "A static role with a lease of one hour."
        explanation: "Not correct. Static roles have no lease."
    correct_option: b
    explanation: "Correct. Read it at `database/static-creds/<role>`."

  - id: ats114-final-q10
    type: single_choice
    difficulty: beginner
    learning_objective: "Read a ciphertext prefix"
    source_readings:
      - sections/section-040/module-01/course-01-encryption-as-a-service.md
    prompt: "A ciphertext starts with `vault:v2:`. What does `v2` mean?"
    options:
      - id: a
        text: "The data was encrypted twice."
        explanation: "Not correct. It names a key version."
      - id: b
        text: "The ciphertext uses version 2 of the API."
        explanation: "Not correct. It is not an API version."
      - id: c
        text: "Key version 2 of the Transit key encrypted it."
        explanation: "Correct. Transit reads the version to pick the right key."
      - id: d
        text: "The ciphertext expires after 2 days."
        explanation: "Not correct. Ciphertext has no expiry."
    correct_option: c
    explanation: "Correct. Transit reads the version to pick the right key."

  - id: ats114-final-q11
    type: single_choice
    difficulty: beginner
    learning_objective: "Explain a key rotation"
    source_readings:
      - sections/section-040/module-01/course-02-key-rotation-and-rewrap.md
    prompt: "After `bao write -f transit/keys/inventory-records/rotate`, what happens?"
    options:
      - id: a
        text: "All old ciphertext is re-encrypted at once."
        explanation: "Not correct. That is rewrap, and the application must run it."
      - id: b
        text: "The old versions are deleted."
        explanation: "Not correct. They stay in the key ring."
      - id: c
        text: "The key name changes."
        explanation: "Not correct. The name stays the same."
      - id: d
        text: "A new key version is added. New encryptions use it, and older versions stay so old ciphertext still decrypts."
        explanation: "Correct. `latest_version` goes up by one."
    correct_option: d
    explanation: "Correct. `latest_version` goes up by one."

  - id: ats114-final-q12
    type: single_choice
    difficulty: advanced
    learning_objective: "Order a key retirement"
    source_readings:
      - sections/section-040/module-01/course-02-key-rotation-and-rewrap.md
    prompt: "A key might have leaked. Which order is safe?"
    options:
      - id: a
        text: "Rotate, rewrap and save every record, then raise `min_decryption_version`."
        explanation: "Correct. Retiring first would make records on old versions unreadable."
      - id: b
        text: "Raise `min_decryption_version`, rotate, then rewrap."
        explanation: "Not correct. Old records stop decrypting before they are rewrapped."
      - id: c
        text: "Rewrap, then rotate, then raise `min_decryption_version`."
        explanation: "Not correct. Rewrap before rotate has no newer version to move to."
      - id: d
        text: "Delete the key and create one with the same name."
        explanation: "Not correct. The new key has new material, and old ciphertext is lost."
    correct_option: a
    explanation: "Correct. Retiring first would make records on old versions unreadable."
