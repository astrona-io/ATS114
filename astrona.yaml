# Course manifest for ATS114 - Secrets Engines & Dynamic Credential Lifecycle (OpenBao).
#
# One entry per section under `modules:`. Each section lists, in order: its
# README, then for each module the landing page (course.md), its parts
# (course-0N-*.md), and right after the part a lab tests, the lab's
# question.md reading and the `type: lab` entry. The module's summary page
# comes last. The section capstone closes the section. Playgrounds are not
# listed: the landing page's playground marker shows them. solution.md is
# never listed.
#
# Every `path:` is relative to this file.

training:
  id: ATS114
  title: "OpenBao: Secrets Engines & Dynamic Credential Lifecycle"
  maturity: alpha
  description: >
    Training material covering the Secrets Engines & Dynamic Credential
    Lifecycle domain of the OpenBao training path: static secrets with
    versions, soft deletes, rollback and check-and-set in KV version 2, a
    two-tier certificate authority with the PKI engine, short-lived
    PostgreSQL credentials from the database engine with leases, renewal,
    revocation and root rotation, and encryption as a service with the
    Transit engine, key rotation and rewrap. Further modules cover mounts and
    response wrapping, PKI issuers and revocation, leases and database
    configuration, signing with Transit, and the TOTP and SSH engines. Each module pairs a layered
    reader with an ungraded hands-on playground and a graded practice lab.
    Each section closes with an integration capstone.
    Written for OpenBao v2.7.1.

  certification:
    name: OpenBao
    code: OPENBAO
    provider: Astrona

modules:

  - id: module-intro
    title: "Introduction"
    description: >
      Start here. What this course trains you to do, how it is laid out, how
      to get your machine ready with the astrona command-line tool, how the
      content is written and checked, who maintains it, and how to report a
      mistake.

    content:
      - type: reading
        title: Introduction
        path: sections/intro/README.md
      - type: reading
        title: "Welcome To The Course"
        path: sections/intro/course-01-welcome.md
      - type: reading
        title: "Get Your Machine Ready"
        path: sections/intro/course-02-get-your-machine-ready.md
      - type: reading
        title: "How This Course Is Made"
        path: sections/intro/course-03-how-this-course-is-made.md

